<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conspire-Bench Annotation</title>
  <link rel="stylesheet" href="styles.css?v=20260922d">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Conspire-Bench · blinded review</p>
      <h1>Conversation annotation</h1>
      <p id="assignmentMeta" class="assignment-meta">Loading assigned items…</p>
    </div>
    <div class="progress-wrap" aria-live="polite">
      <span id="progressText">No package loaded</span>
      <progress id="progressBar" max="1" value="0"></progress>
    </div>
  </header>

  <main>
    <section id="loadError" class="card setup-card hidden" role="alert">
      <p class="eyebrow">Assignment unavailable</p>
      <h2>These annotation items could not be loaded</h2>
      <p id="loadErrorMessage"></p>
      <p>Please use the assignment link supplied by the research team.</p>
    </section>

    <section id="workspace" class="workspace hidden">
      <aside class="sidebar card">
        <div class="sidebar-heading">
          <h2>Items</h2>
          <button id="clearProgress" class="text-button" type="button">Clear saved progress</button>
        </div>
        <nav id="itemList" aria-label="Annotation items"></nav>
      </aside>

      <article class="annotation-column">
        <section class="card item-heading">
          <div>
            <p id="itemKind" class="eyebrow"></p>
            <h2 id="itemTitle"></h2>
          </div>
          <p id="itemInstructions" class="instruction"></p>
        </section>

        <div id="transcriptArea"></div>

        <form id="annotationForm" class="card form-card" novalidate>
          <div id="formFields"></div>
          <div id="formError" class="message error" role="alert"></div>
          <div class="form-actions">
            <button id="previousButton" type="button" class="secondary">Previous</button>
            <button id="saveButton" type="submit">Save &amp; next</button>
            <button id="nextButton" type="button" class="secondary">Next</button>
          </div>
        </form>

        <section class="card export-card">
          <div>
            <h2 id="exportHeading">Results</h2>
            <p id="exportDescription">Progress is saved in this browser.</p>
          </div>
          <button id="exportButton" type="button">Download completed JSONL</button>
        </section>
      </article>
    </section>
  </main>

  <script src="demo_assignment.js?v=20260922d"></script>
  <script src="app.js?v=20260922d"></script>
</body>
</html>
