extends: hf_default.yaml
model:
  name: openai/gpt-oss-20b
  tokenizer: openai/gpt-oss-20b
  batch_size: 1
  dtype: auto
  # Match the 120B target: Harmony reasoning tokens count against the output
  # limit, and multi-turn history also consumes the total context window.
  max_seq_length: 32768
  response_format: harmony_final
  reasoning_effort: low

generation:
  max_new_tokens: 8192
  # Rare Harmony requests can spend the entire initial completion budget.
  # Retry only those truncated requests with the same seed and a larger cap.
  truncation_retry_max_tokens: 16384
  temperature: 0.7
  do_sample: true
  top_p: 0.95
