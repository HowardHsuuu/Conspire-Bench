extends: hf_default.yaml
model:
  name: openai/gpt-oss-120b
  tokenizer: openai/gpt-oss-120b
  batch_size: 1
  dtype: auto
  # The Harmony reasoning channel and visible answer share the completion
  # budget. Keep enough total context for low-effort reasoning plus multi-turn
  # history; 2,048 output tokens truncated most observed responses.
  max_seq_length: 32768
  response_format: harmony_final
  reasoning_effort: low

generation:
  max_new_tokens: 8192
  # Rare Harmony requests can spend the entire initial completion budget.
  # Retry only those truncated requests with the same sampling settings and a
  # larger cap.
  truncation_retry_max_tokens: 16384
  temperature: 0.7
  do_sample: true
  top_p: 0.95
