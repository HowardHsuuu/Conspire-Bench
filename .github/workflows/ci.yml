name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install API and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate V3 dataset
        run: |
          python scripts/validate_dataset.py Conspire-Bench-v3.json --strict-metadata
          python scripts/validate_interaction_catalog_v3.py
          python scripts/validate_context_variants_v3.py
      - name: Run tests
        run: python -m unittest discover -s tests
