name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install API and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check formatting, lint, and types
        run: |
          ruff format --check .
          ruff check .
          mypy
      - name: Validate V3 dataset
        run: |
          python scripts/validate_dataset.py Conspire-Bench-v3.json --strict-metadata
          python scripts/validate_interaction_catalog_v3.py
          python scripts/validate_context_variants_v3.py
          python scripts/validate_experiment_configs_v3.py
          python scripts/validate_analysis_plan_v3.py
          python scripts/audit_release_readiness.py
          bash -n scripts/runpod_5090_smoke.sh
          python main.py \
            --config configs/experiment_v3_local_smoke.json \
            --dataset Conspire-Bench-v3.json \
            --validate-only \
            --scenario-ids v3_weather_cloud_seeding_single_001 \
            --context-variants neutral_none
      - name: Run tests
        run: python -m unittest discover -s tests
